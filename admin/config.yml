# =====================================================================
#  CMS — Tool báo giá KiotViet
#  Quy ước chung:
#   • Giá nhập bằng số, đơn vị đồng (VD 3960000). Ô để trống = không áp dụng.
#   • Thiết bị LUÔN chọn từ "Danh mục thiết bị" (ô chọn thiết bị) — không gõ tay tên máy.
#   • Đổi TÊN một thiết bị trong danh mục sẽ làm các mục đã chọn thiết bị đó mất liên kết → chọn lại.
#  Ghi chú kỹ thuật: các khối lặp lại được khai báo 1 lần (&tên) và dùng lại (*tên) để file gọn,
#  sửa 1 chỗ là áp cho mọi ngành. Không đổi "name:" của trường — tool báo giá đọc theo đúng tên này.
# =====================================================================
backend:
  name: github
  repo: ngvhug38/dshn1tool
  branch: main
local_backend: false
media_folder: images
public_folder: /images

collections:

# ---------------------------------------------------------------------
# 1. BẢNG GIÁ & KHUYẾN MÃI
# ---------------------------------------------------------------------
- name: gia
  label: 💰 Bảng giá & khuyến mãi
  files:

  # ===== 1a. Bảng giá niêm yết (data/pricing.json) =====
  - name: pricing_all_industries
    label: Bảng giá niêm yết (4 ngành)
    file: data/pricing.json
    fields:
    - { label: "Logo công ty", name: logoUrl, widget: image, required: false }

    # ---- Phần dùng chung cho cả 4 ngành ----
    - label: ⚙️ Giá dùng chung (áp cho mọi ngành)
      name: addons
      widget: object
      collapsed: true
      fields:

      - label: Mua thêm kho (giá/kho/tháng) — gói Chuyên Nghiệp
        name: khoChuyenNghiep
        widget: object
        fields: &kho_fields
        - { label: "Kỳ hạn 1 năm", name: nam1, widget: currency, value_type: int }
        - { label: "Kỳ hạn 2 năm", name: nam2, widget: currency, value_type: int }
        - { label: "Kỳ hạn 3 năm", name: nam3, widget: currency, value_type: int }
        - { label: "Kỳ hạn 5 năm", name: nam5, widget: currency, value_type: int }
      - label: Mua thêm kho (giá/kho/tháng) — gói Cao Cấp
        name: khoCaoCap
        widget: object
        fields: *kho_fields

      - label: Combo gói Chuyên Nghiệp + thiết bị
        name: comboPosList
        widget: list
        required: false
        allow_add: true
        summary: "{{fields.ten}}"
        hint: Mỗi dòng là 1 combo = gói Chuyên Nghiệp + 1 hoặc nhiều thiết bị (VD máy POS + máy in + két). Báo giá sẽ gạch giá lẻ từng món và hiện 1 dòng giá combo trọn gói (combo 1 máy giữ cách hiển thị cũ). Để trống cả danh sách = dùng 4 combo máy POS mặc định.
        fields:
        - { label: "Tên combo", name: ten, widget: string, hint: 'Hiện trong ô chọn và trên báo giá. VD "Combo POS D2 + máy in + két"' }
        - { label: "Thiết bị trong combo", name: thietBi, widget: devicepicker, hint: "Chọn 1 hoặc nhiều thiết bị. Thiết bị không còn trong danh mục thì combo tự ẩn và tool báo lỗi." }
        - { label: "Giá combo 1 năm", name: nam1, widget: currency, value_type: int, required: false, hint: "Giá trọn gói (phần mềm + thiết bị). Để trống = không bán kỳ hạn này." }
        - { label: "Giá combo 2 năm", name: nam2, widget: currency, value_type: int, required: false }
        - { label: "Giá combo 3 năm", name: nam3, widget: currency, value_type: int, required: false }
        - { label: "Tạm ẩn combo này", name: an, widget: boolean, default: false, required: false }

      - label: Combo nhiều chi nhánh — gói Chuyên Nghiệp (1 mức, 50 chi nhánh)
        name: comboChiNhanhChuyenNghiep
        widget: list
        min: 1
        max: 1
        allow_add: false
        fields: &cn_price_fields
        - { label: "Giá 1 năm", name: gia1nam, widget: currency, value_type: int }
        - { label: "Giá 2 năm", name: gia2nam, widget: currency, value_type: int }
        - { label: "Giá 3 năm", name: gia3nam, widget: currency, value_type: int }
        - { label: "Giá 5 năm", name: gia5nam, widget: currency, value_type: int }
      - label: Combo nhiều chi nhánh — gói Cao Cấp (4 mức cố định)
        name: comboChiNhanhCaoCap
        widget: list
        min: 4
        max: 4
        allow_add: false
        summary: "{{fields.tierLabel}}"
        hint: "Giữ đúng thứ tự 4 mức, không thêm/xoá/kéo đổi chỗ: 1) 15 CN · 2) 16–30 CN · 3) 31–50 CN · 4) từ 65 CN."
        fields:
        - { label: "Tên mức (chỉ để hiển thị)", name: tierLabel, widget: string }
        - { label: "Giá 1 năm", name: gia1nam, widget: currency, value_type: int }
        - { label: "Giá 2 năm", name: gia2nam, widget: currency, value_type: int }
        - { label: "Giá 3 năm", name: gia3nam, widget: currency, value_type: int }
        - { label: "Giá 5 năm", name: gia5nam, widget: currency, value_type: int }

      - label: Mua thêm hóa đơn điện tử (theo bậc)
        name: hoaDonDienTuMuaThem
        widget: list
        allow_add: true
        summary: "{{fields.soLuong}} hóa đơn — {{fields.gia}}đ"
        fields:
        - { label: "Số lượng hóa đơn", name: soLuong, widget: number, value_type: int }
        - { label: "Giá thường", name: gia, widget: currency, value_type: int }
        - { label: "Giá khuyến mãi", name: giaKhuyenMai, widget: currency, value_type: int, required: false, hint: "Để trống nếu không có." }

    # ---- Bảng giá từng ngành (cấu trúc giống nhau, khai báo 1 lần) ----
    - label: 🏪 Bán lẻ (Retail)
      name: retail
      widget: object
      collapsed: true
      fields: &pricing_industry_fields
      - &pkg_hotro
        label: Gói Hỗ Trợ
        name: hotro
        widget: object
        fields:
        - { label: "Giá/tháng", name: giaThangChiNhanh1, widget: currency, value_type: int }
        - label: Các kỳ hạn
          name: cacMucNam
          widget: list
          summary: "{{fields.soNam}} năm — {{fields.giaTron}}đ"
          fields:
          - { label: "Số năm", name: soNam, widget: number, value_type: int, hint: "1, 2, 3 hoặc 5" }
          - { label: "Giá trọn kỳ hạn", name: giaTron, widget: currency, value_type: int }
          - &f_hddt { label: "Hóa đơn điện tử tặng/năm", name: hoaDonTang, widget: number, value_type: int }
          - &f_vtien { label: "Voucher tối đa — số tiền", name: voucherToiDaTien, widget: currency, value_type: int, hint: "Mức trần Sale được tự giảm cho khách (không phải khuyến mãi tự động)." }
          - &f_vthang { label: "Voucher tối đa — số tháng tặng", name: voucherToiDaThang, widget: number, value_type: int, required: false, hint: "Để trống nếu kỳ hạn này không cho tặng tháng." }
          - &f_qua { label: "Quà tặng mặc định", name: quaTangMacDinh, widget: devicepicker, required: false, hint: "Chỉ dùng khi KHÔNG có khuyến mãi đang chạy. Chọn 1 hoặc nhiều thiết bị." }
      - label: Gói Chuyên Nghiệp
        name: chuyennghiep
        widget: object
        fields: &pkg_multi_branch_fields
        - { label: "Giá/tháng — chi nhánh 1", name: giaThangChiNhanh1, widget: currency, value_type: int }
        - { label: "Giá/tháng — từ chi nhánh 2", name: giaThangChiNhanh2, widget: currency, value_type: int }
        - label: Các kỳ hạn
          name: cacMucNam
          widget: list
          summary: "{{fields.soNam}} năm — {{fields.giaChiNhanh1}}đ"
          fields:
          - { label: "Số năm", name: soNam, widget: number, value_type: int, hint: "1, 2, 3 hoặc 5" }
          - { label: "Giá trọn kỳ hạn — chi nhánh 1", name: giaChiNhanh1, widget: currency, value_type: int }
          - { label: "Giá trọn kỳ hạn — từ chi nhánh 2", name: giaChiNhanh2, widget: currency, value_type: int }
          - *f_hddt
          - *f_vtien
          - *f_vthang
          - *f_qua
      - label: Gói Cao Cấp
        name: caocap
        widget: object
        fields: *pkg_multi_branch_fields
      - &f_goi_bo_sung
        label: "Gói bổ sung (gói tự tạo ở Danh mục gói)"
        name: goiBoSung
        widget: list
        required: false
        collapsed: true
        label_singular: "giá cho 1 gói bổ sung"
        summary: "{{fields.ma}} — {{fields.giaThangChiNhanh1}}đ/tháng"
        hint: "Giá theo ngành của các gói KHÁC 3 gói chính (VD Đồng hành, hoặc gói mới tạo ở 📦 Danh mục gói). Gói không có giá ở ngành này sẽ không hiện cho ngành này."
        fields:
        - { label: "Gói", name: ma, widget: relation, collection: goi, file: packages, search_fields: ["danhSach.*.ten", "danhSach.*.ma"], value_field: "danhSach.*.ma", display_fields: ["danhSach.*.ten"] }
        - { label: "Giá/tháng — chi nhánh 1", name: giaThangChiNhanh1, widget: currency, value_type: int }
        - { label: "Giá/tháng — từ chi nhánh 2", name: giaThangChiNhanh2, widget: currency, value_type: int, required: false, hint: "Chỉ cần khi gói cho mua thêm chi nhánh." }
        - label: "Giá mua thêm kho (giá/kho theo kỳ hạn)"
          name: giaKho
          widget: object
          required: false
          collapsed: true
          hint: "Chỉ cần khi gói cho mua thêm kho."
          fields:
          - { label: "Kỳ hạn 1 năm", name: nam1, widget: currency, value_type: int, required: false }
          - { label: "Kỳ hạn 2 năm", name: nam2, widget: currency, value_type: int, required: false }
          - { label: "Kỳ hạn 3 năm", name: nam3, widget: currency, value_type: int, required: false }
          - { label: "Kỳ hạn 5 năm", name: nam5, widget: currency, value_type: int, required: false }
        - label: Các kỳ hạn
          name: cacMucNam
          widget: list
          summary: "{{fields.soNam}} năm — {{fields.giaChiNhanh1}}đ"
          hint: "Chỉ kỳ hạn có giá mới hiện trên trang báo giá."
          fields:
          - { label: "Số năm", name: soNam, widget: number, value_type: int, hint: "1, 2, 3 hoặc 5" }
          - { label: "Giá trọn kỳ hạn — chi nhánh 1", name: giaChiNhanh1, widget: currency, value_type: int }
          - { label: "Giá trọn kỳ hạn — từ chi nhánh 2", name: giaChiNhanh2, widget: currency, value_type: int, required: false }
          - *f_hddt
          - *f_vtien
          - *f_vthang
          - *f_qua

    - { label: "🍽️ Ăn uống (FnB)", name: fnb, widget: object, collapsed: true, fields: *pricing_industry_fields }
    - { label: "💆 Sức khỏe, làm đẹp (Salon)", name: salon, widget: object, collapsed: true, fields: *pricing_industry_fields }

    - label: 🏨 Lưu trú, đặt phòng (Booking)
      name: booking
      widget: object
      collapsed: true
      fields:
      - *pkg_hotro
      - { label: "Gói Chuyên Nghiệp", name: chuyennghiep, widget: object, fields: *pkg_multi_branch_fields }
      - { label: "Gói Cao Cấp", name: caocap, widget: object, fields: *pkg_multi_branch_fields }
      - *f_goi_bo_sung
      - label: Combo nhiều chi nhánh riêng cho Booking — gói Chuyên Nghiệp
        name: comboChiNhanhChuyenNghiepTuyChinh
        widget: list
        required: false
        allow_add: true
        summary: "{{fields.label}}"
        hint: Để trống = dùng chung mức của các ngành khác. Mức nào thiếu giá ở kỳ hạn nào thì tự ẩn ở kỳ hạn đó.
        fields: &booking_tier_fields
        - { label: "Tên mức", name: label, widget: string, hint: 'VD "Combo 1 (6–15 CN)"' }
        - label: Kiểu số chi nhánh
          name: type
          widget: select
          default: range
          options:
          - { label: "Cố định (VD đúng 50 CN) — nhập ô Số cố định", value: fixed }
          - { label: "Khoảng (VD 16–30 CN) — nhập ô Từ và Đến", value: range }
          - { label: "Từ … trở lên (VD từ 65 CN) — nhập ô Từ", value: open }
        - { label: "Số chi nhánh cố định", name: count, widget: number, value_type: int, required: false }
        - { label: "Từ (chi nhánh)", name: min, widget: number, value_type: int, required: false }
        - { label: "Đến (chi nhánh)", name: max, widget: number, value_type: int, required: false }
        - { label: "Giá 1 năm", name: gia1nam, widget: currency, required: false }
        - { label: "Giá 2 năm", name: gia2nam, widget: currency, required: false }
        - { label: "Giá 3 năm", name: gia3nam, widget: currency, required: false }
        - { label: "Giá 5 năm", name: gia5nam, widget: currency, required: false }
      - label: Combo nhiều chi nhánh riêng cho Booking — gói Cao Cấp
        name: comboChiNhanhCaoCapTuyChinh
        widget: list
        required: false
        allow_add: true
        summary: "{{fields.label}}"
        hint: Để trống = dùng chung mức của các ngành khác. Mức nào thiếu giá ở kỳ hạn nào thì tự ẩn ở kỳ hạn đó.
        fields: *booking_tier_fields

  # ===== 1b. Khuyến mãi đang chạy (data/promotions.json) =====
  - name: promotions
    label: Khuyến mãi đang chạy
    file: data/promotions.json
    fields:
    - { label: "Bật khuyến mãi", name: active, widget: boolean, default: true }
    - { label: "Tên đợt khuyến mãi", name: ten, widget: string, hint: 'VD "Khuyến mãi tháng 8–9/2026"' }
    - { label: "Ngày bắt đầu", name: tuNgay, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
    - { label: "Ngày kết thúc", name: denNgay, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, hint: "Hết ngày này tool tự quay về bảng giá niêm yết." }

    - label: "🖥️ Khuyến mãi combo gói phần mềm + máy POS"
      name: comboKhuyenMai
      label_singular: "khuyến mãi cho 1 combo"
      widget: list
      required: false
      allow_add: true
      collapsed: false
      summary: "{{fields.combo}}"
      hint: "Mỗi dòng = khuyến mãi riêng của 1 combo (chọn từ danh sách combo ở Bảng giá niêm yết). Chỉ áp dụng trong thời gian đợt khuyến mãi ở trên. Combo không có dòng ở đây = không có khuyến mãi. Đổi tên combo ở Bảng giá thì chọn lại combo ở đây."
      fields:
      - { label: "Combo", name: combo, widget: relation, collection: gia, file: pricing_all_industries, search_fields: ["addons.comboPosList.*.ten"], value_field: "addons.comboPosList.*.ten", display_fields: ["addons.comboPosList.*.ten"] }
      - label: "Kỳ hạn 1 năm"
        name: nam1
        widget: object
        required: false
        fields: &combo_promo_term_fields
        - { label: "Voucher giảm tối đa (đ)", name: giam, widget: currency, value_type: int, required: false, hint: "Mức trần Sale được giảm cho khách." }
        - { label: "Tặng thêm tối đa (tháng)", name: thangTang, widget: number, value_type: int, required: false, hint: "Sale chọn 1 trong 2: giảm tiền HOẶC tặng tháng." }
        - { label: "Thiết bị tặng thêm", name: quaThietBi, widget: devicepicker, required: false, hint: "Tặng kèm ngoài thiết bị có sẵn trong combo. Hiện trên báo giá với giá 0đ." }
      - { label: "Kỳ hạn 2 năm", name: nam2, widget: object, required: false, fields: *combo_promo_term_fields }
      - { label: "Kỳ hạn 3 năm", name: nam3, widget: object, required: false, fields: *combo_promo_term_fields }

    - label: 🏪 Bán lẻ (Retail)
      name: retail
      widget: object
      collapsed: true
      fields: &promo_industry_fields
      - { label: "Ngành này không bán combo gói + thiết bị", name: khongCombo, widget: boolean, default: false, required: false }
      - label: Gói Hỗ Trợ
        name: hotro
        widget: object
        collapsed: true
        fields: &promo_pkg_fields
        - label: Kỳ hạn 1 năm
          name: nam1
          widget: object
          fields: &promo_term_fields
          - { label: "Giảm tối đa (đ)", name: giam, widget: currency, value_type: int, required: false }
          - { label: "Tặng thêm tối đa (tháng)", name: thangTang, widget: number, value_type: int, required: false }
          - { label: "Hóa đơn điện tử tặng/năm", name: hddtNam, widget: number, value_type: int, required: false }
          - { label: "Thiết bị tặng", name: quaThietBi, widget: devicepicker, required: false, hint: "Ưu tiên dùng ô này — chọn đúng thiết bị trong danh mục, tool tự lấy ảnh & giá." }
          - { label: "Mô tả quà (chỉ khi không chọn được thiết bị)", name: qua, widget: string, required: false, hint: 'Dùng cho quà dạng "chọn 1 trong…" hoặc vật tư. Ghi kèm mã máy, VD "Tặng KV505 hoặc KV99".' }
        - { label: "Kỳ hạn 2 năm", name: nam2, widget: object, fields: *promo_term_fields }
        - { label: "Kỳ hạn 3 năm", name: nam3, widget: object, fields: *promo_term_fields }
        - { label: "Kỳ hạn 5 năm", name: nam5, widget: object, fields: *promo_term_fields }
      - { label: "Gói Chuyên Nghiệp", name: chuyennghiep, widget: object, collapsed: true, fields: *promo_pkg_fields }
      - { label: "Gói Cao Cấp", name: caocap, widget: object, collapsed: true, fields: *promo_pkg_fields }

    - { label: "🍽️ Ăn uống (FnB)", name: fnb, widget: object, collapsed: true, fields: *promo_industry_fields }
    - { label: "💆 Sức khỏe, làm đẹp (Salon)", name: salon, widget: object, collapsed: true, fields: *promo_industry_fields }
    - { label: "🏨 Lưu trú, đặt phòng (Booking)", name: booking, widget: object, collapsed: true, fields: *promo_industry_fields }

# ---------------------------------------------------------------------
# 2. SO SÁNH TÍNH NĂNG (Báo giá tổng)
# ---------------------------------------------------------------------
- name: goi
  label: "📦 Danh mục gói phần mềm"
  files:
  - name: packages
    label: "Danh mục gói (Trọn gói)"
    file: data/packages.json
    fields:
    - label: "Các gói"
      name: danhSach
      widget: list
      label_singular: "gói"
      collapsed: true
      summary: "{{fields.ten}} ({{fields.ma}})"
      hint: "Thứ tự trong danh sách = thứ tự thẻ gói trên trang báo giá (kéo ═ để đổi). Giá: 3 gói chính (hotro, chuyennghiep, caocap) nhập ở Bảng giá ngành như cũ; gói khác nhập ở mục \"Gói bổ sung\" của từng ngành."
      fields:
      - { label: "Mã gói", name: ma, widget: string, pattern: ["^[a-z0-9]+$", "Chỉ chữ thường không dấu và số, không khoảng trắng (VD khoidau)"], hint: "Mã cố định để liên kết giá & khuyến mãi — KHÔNG đổi sau khi tạo. Gói có sẵn: hotro, chuyennghiep, caocap, dongthanh." }
      - { label: "Tên gói", name: ten, widget: string, hint: "Hiện trên thẻ chọn gói và trên báo giá." }
      - { label: "Hiện trên trang báo giá", name: hien, widget: boolean, default: true }
      - { label: "Ngành áp dụng", name: nganhApDung, widget: select, multiple: true, required: false, hint: "Để trống = mọi ngành.", options: [ { label: "Bán lẻ", value: retail }, { label: "Ăn uống (FnB)", value: fnb }, { label: "Sức khỏe, làm đẹp (Salon)", value: salon }, { label: "Lưu trú, đặt phòng (Booking)", value: booking } ] }
      - { label: "Cho mua thêm chi nhánh & kho", name: moRong, widget: boolean, default: false, required: false, hint: "Bật thì cần nhập giá chi nhánh 2 và giá kho của gói ở Bảng giá." }
      - { label: "Mô tả ngắn trên thẻ gói", name: moTaNgan, widget: string, required: false, hint: "1 dòng giúp Sale chọn nhanh. VD \"Nhiều chi nhánh, quản lý kho\"" }
      - { label: "Tính năng (dùng cho mọi ngành)", name: tinhNangChung, widget: list, required: false, field: { label: "Tính năng", name: tinhNang, widget: string }, hint: "Hiện thành gạch đầu dòng trong báo giá." }
      - label: "Tính năng riêng theo ngành"
        name: tinhNangTheoNganh
        widget: object
        required: false
        collapsed: true
        hint: "Ngành nào có danh sách riêng thì dùng danh sách riêng thay cho tính năng chung."
        fields:
        - { label: "Bán lẻ", name: retail, widget: list, required: false, field: { label: "Tính năng", name: tinhNang, widget: string } }
        - { label: "Ăn uống (FnB)", name: fnb, widget: list, required: false, field: { label: "Tính năng", name: tinhNang, widget: string } }
        - { label: "Sức khỏe, làm đẹp (Salon)", name: salon, widget: list, required: false, field: { label: "Tính năng", name: tinhNang, widget: string } }
        - { label: "Lưu trú, đặt phòng (Booking)", name: booking, widget: list, required: false, field: { label: "Tính năng", name: tinhNang, widget: string } }
      - { label: "Quyền lợi tặng kèm", name: quyenLoi, widget: list, required: false, field: { label: "Quyền lợi", name: quyenLoi, widget: string }, hint: "Để trống = 3 quyền lợi mặc định (miễn phí HĐĐT, chữ ký số, phần mềm kế toán)." }

- name: tinhnang
  label: 🧩 So sánh tính năng
  files:
  - name: features_all_industries
    label: Bảng so sánh tính năng (4 ngành)
    file: data/features.json
    fields:
    - label: Hướng dẫn
      name: __huongdan
      widget: markdown
      required: false
      hint: "Mỗi ô tính năng nhập: ✓ = có (nổi bật) · ~ = có (cơ bản) · — = không có · hoặc ghi chữ (VD \"15 NV/cửa hàng\"). Kéo-thả để đổi thứ tự dòng."
    - label: 🏪 Bán lẻ (Retail)
      name: retail
      widget: object
      collapsed: true
      fields: &feature_industry_fields
      - label: Mô tả ngắn từng gói (đầu bảng so sánh)
        name: moTaGoi
        widget: object
        fields:
        - { label: "Gói Hỗ Trợ", name: hotro, widget: string }
        - { label: "Gói Chuyên Nghiệp", name: chuyennghiep, widget: string }
        - { label: "Gói Cao Cấp", name: caocap, widget: string }
      - label: Danh sách tính năng
        name: tinhNang
        widget: list
        allow_add: true
        summary: "{{fields.ten}}"
        fields:
        - { label: "Tên tính năng", name: ten, widget: string }
        - { label: "Gắn nhãn \"Mới\"", name: moi, widget: boolean, default: false, required: false }
        - { label: "Gói Hỗ Trợ", name: hotro, widget: string }
        - { label: "Gói Chuyên Nghiệp", name: chuyennghiep, widget: string }
        - { label: "Gói Cao Cấp", name: caocap, widget: string }
    - { label: "🍽️ Ăn uống, giải trí (FnB)", name: fnb, widget: object, collapsed: true, fields: *feature_industry_fields }
    - { label: "💆 Sức khỏe, làm đẹp (Salon)", name: salon, widget: object, collapsed: true, fields: *feature_industry_fields }
    - { label: "🏨 Lưu trú, đặt phòng (Booking)", name: booking, widget: object, collapsed: true, fields: *feature_industry_fields }

