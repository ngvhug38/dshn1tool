backend:
  name: github
  repo: ngvhug38/dshn1tool
  branch: main
local_backend: false
media_folder: images
public_folder: /images
collections:
- name: gia
  label: 💰 Bảng giá & khuyến mãi
  files:
  - name: pricing_all_industries
    label: 💰 Bảng giá toàn ngành
    file: data/pricing.json
    fields:
    - label: 🖼️ Logo công ty
      name: logoUrl
      widget: image
      required: false
    - label: 🧩 Addon dùng chung (áp dụng CHO MỌI NGÀNH — sửa 1 lần)
      name: addons
      widget: object
      collapsed: false
      hint: Các mức giá ở đây áp dụng chung cho cả 4 ngành, không cần nhập lại riêng từng ngành.
      fields:
      - label: 📦 Giá mua thêm kho/tháng — Gói Chuyên Nghiệp
        name: khoChuyenNghiep
        widget: object
        fields:
        - label: 📅 1 năm
          name: nam1
          widget: number
          value_type: int
        - label: 📅 2 năm
          name: nam2
          widget: number
          value_type: int
        - label: 📅 3 năm
          name: nam3
          widget: number
          value_type: int
        - label: 📅 5 năm
          name: nam5
          widget: number
          value_type: int
      - label: 📦 Giá mua thêm kho/tháng — Gói Cao Cấp
        name: khoCaoCap
        widget: object
        fields:
        - label: 📅 1 năm
          name: nam1
          widget: number
          value_type: int
        - label: 📅 2 năm
          name: nam2
          widget: number
          value_type: int
        - label: 📅 3 năm
          name: nam3
          widget: number
          value_type: int
        - label: 📅 5 năm
          name: nam5
          widget: number
          value_type: int
      - label: 🖨️ Combo Chuyên Nghiệp + Máy POS (giá trọn gói theo năm)
        name: comboPos
        widget: object
        hint: Giá gói đã bao gồm máy POS, tính theo số năm sử dụng.
        fields:
        - label: 📅 1 năm
          name: nam1
          widget: object
          fields:
          - label: D2 Single
            name: D2 Single
            widget: number
            value_type: int
          - label: D68 Dual
            name: D68 Dual
            widget: number
            value_type: int
          - label: KV88
            name: KV88
            widget: number
            value_type: int
          - label: D10 Pro
            name: D10 Pro
            widget: number
            value_type: int
        - label: 📅 2 năm
          name: nam2
          widget: object
          fields:
          - label: D2 Single
            name: D2 Single
            widget: number
            value_type: int
          - label: D68 Dual
            name: D68 Dual
            widget: number
            value_type: int
          - label: KV88
            name: KV88
            widget: number
            value_type: int
          - label: D10 Pro
            name: D10 Pro
            widget: number
            value_type: int
        - label: 📅 3 năm
          name: nam3
          widget: object
          fields:
          - label: D2 Single
            name: D2 Single
            widget: number
            value_type: int
          - label: D68 Dual
            name: D68 Dual
            widget: number
            value_type: int
          - label: KV88
            name: KV88
            widget: number
            value_type: int
          - label: D10 Pro
            name: D10 Pro
            widget: number
            value_type: int
      - label: 🏢 Combo chi nhánh — Gói Chuyên Nghiệp
        name: comboChiNhanhChuyenNghiep
        widget: list
        min: 1
        max: 1
        allow_add: false
        hint: 'Đúng 1 mức: 50 chi nhánh (cố định).'
        fields:
        - label: 💵 1 năm
          name: gia1nam
          widget: number
          value_type: int
        - label: 💵 2 năm
          name: gia2nam
          widget: number
          value_type: int
        - label: 💵 3 năm
          name: gia3nam
          widget: number
          value_type: int
        - label: 💵 5 năm
          name: gia5nam
          widget: number
          value_type: int
      - label: '🏢 Combo chi nhánh — Gói Cao Cấp (4 mức theo thứ tự: 15CN / 16-30CN / 31-50CN / 65+CN)'
        name: comboChiNhanhCaoCap
        widget: list
        min: 4
        max: 4
        allow_add: false
        hint: 'ĐÚNG THỨ TỰ 4 mức, không thêm/xóa/đảo vị trí: 1) 15 chi nhánh · 2) 16-30 chi nhánh · 3) 31-50 chi nhánh · 4) Từ 65 chi nhánh trở lên.'
        fields:
        - label: 🏷️ Mức chi nhánh (CHỈ ĐỂ HIỂN THỊ — không đổi thứ tự các mục bên dưới!)
          name: tierLabel
          widget: string
        - label: 💵 1 năm
          name: gia1nam
          widget: number
          value_type: int
        - label: 💵 2 năm
          name: gia2nam
          widget: number
          value_type: int
        - label: 💵 3 năm
          name: gia3nam
          widget: number
          value_type: int
        - label: 💵 5 năm
          name: gia5nam
          widget: number
          value_type: int
        summary: '{{fields.tierLabel}}'
      - label: 🧾 Mua thêm hóa đơn điện tử (theo bậc số lượng)
        name: hoaDonDienTuMuaThem
        widget: list
        allow_add: true
        summary: '{{fields.soLuong}} hóa đơn — {{fields.gia}}đ'
        fields:
        - label: 🔢 Số lượng
          name: soLuong
          widget: number
          value_type: int
        - label: 💵 Giá thường
          name: gia
          widget: number
          value_type: int
        - label: 🎉 Giá khuyến mãi (để trống nếu không có)
          name: giaKhuyenMai
          widget: number
          value_type: int
          required: false
    - label: 🏪 NGÀNH BÁN LẺ (Retail)
      name: retail
      widget: object
      collapsed: false
      fields:
      - label: 🌱 Gói Hỗ trợ
        name: hotro
        widget: object
        fields:
        - label: 💵 Giá/tháng (chi nhánh 1)
          name: giaThangChiNhanh1
          widget: number
          value_type: int
        - label: 📅 Các mức năm (1/2/3/5)
          name: cacMucNam
          widget: list
          fields:
          - label: 🔢 Số năm
            name: soNam
            widget: number
            value_type: int
          - label: 💵 Giá trọn gói (kỳ hạn này)
            name: giaTron
            widget: number
            value_type: int
          - label: 🧾 Hóa đơn điện tử tặng/năm
            name: hoaDonTang
            widget: number
            value_type: int
          - label: 🎟️ Voucher tối đa - Số tiền (đ)
            name: voucherToiDaTien
            widget: number
            value_type: int
            hint: Mức trần sale được quyền tự nhập giảm giá cho khách (không phải khuyến mãi tự động).
          - label: 🎟️ Voucher tối đa - Số tháng
            name: voucherToiDaThang
            widget: number
            value_type: int
            required: false
            hint: Mức trần số tháng tặng thêm sale được quyền tự chọn. Để trống nếu kỳ hạn này không cho tặng tháng.
          - label: 🎁 Quà tặng mặc định
            name: quaTangMacDinh
            widget: select
            options: &id001
            - label: Không tặng
              value: none
            - label: 01 Máy in hoá đơn KV804
              value: kv804
            - label: 01 Màn hình hiển thị QR - KV99
              value: kv99
            - label: 01 Máy in hóa đơn để bàn KV505
              value: kv505
            - label: Giấy in nhiệt (hóa đơn) K80*45 - 50 cuộn
              value: giay
            - label: Máy in mã vạch 365B
              value: 365b
            - label: 01 Máy quét mã vạch XL-6500A
              value: xl6500a
            default: none
            required: false
            hint: Thiết bị THẬT sẽ tặng khi KHÔNG có khuyến mãi nào đang áp dụng. Chọn từ danh mục để luôn khớp đúng ảnh/giá — không gõ tay.
