              - label: 📦 Giá mua thêm kho/tháng — Gói Chuyên Nghiệp
                name: khoChuyenNghiep
                widget: object
                fields:
                  - {label: "📅 1 năm", name: nam1, widget: number, value_type: int}
                  - {label: "📅 2 năm", name: nam2, widget: number, value_type: int}
                  - {label: "📅 3 năm", name: nam3, widget: number, value_type: int}
