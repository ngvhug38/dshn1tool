# 4. DANH MỤC THIẾT BỊ (nguồn duy nhất cho mọi ô "chọn thiết bị")
# ---------------------------------------------------------------------
- name: thietbi
  label: 🔧 Danh mục thiết bị
  files:
  - name: hardware
    label: Danh mục thiết bị phần cứng
    file: data/hardware.json
    fields:
    - label: Nhóm thiết bị
      name: danhMuc
      widget: list
      allow_add: true
      summary: "{{fields.nhom}}"
      fields:
      - { label: "Tên nhóm", name: nhom, widget: string }
      - label: Sản phẩm
        name: items
        widget: list
        allow_add: true
        summary: "{{fields.name}} — {{fields.price}}đ"
        fields:
        - { label: "Tên sản phẩm", name: name, widget: string, hint: "Nên ghi kèm mã máy (VD \"Máy in hóa đơn KV804\"). Đổi tên sẽ làm combo/quà đã chọn máy này mất liên kết — cần chọn lại." }
        - { label: "Giá bán lẻ", name: price, widget: currency, value_type: int }
        - { label: "Đơn vị tính", name: unit, widget: string, required: false, hint: 'Để trống nếu bán theo máy. VD "Cuộn", "Thùng 50 cuộn".' }
        - { label: "Bảo hành", name: warranty, widget: string, hint: 'VD "12 tháng"' }
        - { label: "Ảnh sản phẩm", name: image, widget: image, required: false }
