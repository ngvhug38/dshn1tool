- name: thietbi
  label: 🔧 Danh mục thiết bị
  files:
  - name: hardware
    label: 🔧 Danh mục thiết bị phần cứng
    file: data/hardware.json
    fields:
    - label: 📦 Nhóm thiết bị
      name: danhMuc
      widget: list
      allow_add: true
      summary: 📦 {{fields.nhom}}
      fields:
      - label: 🏷️ Tên nhóm
        name: nhom
        widget: string
