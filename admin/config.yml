- name: nhansu
  label: 👤 Nhân viên tư vấn
  files:
  - name: nhanvien
    label: Danh sách chuyên viên tư vấn (data/nhanvien.json)
    file: data/nhanvien.json
    fields:
    - label: 🧑‍💼 Danh sách tên chuyên viên tư vấn
      name: danhSach
      widget: list
      allow_add: true
      hint: Mỗi dòng là 1 chuyên viên tư vấn (chuỗi văn bản thuần, không phải object) — giữ đúng cấu trúc mảng string hiện có trong data/nhanvien.json, hiển thị cho khách chọn trên tool báo giá.
- name: thietbi
  label: 🔧 Danh mục thiết bị
  files:
  - name: hardware
    label: 🔧 Danh mục thiết bị phần cứng
    file: data/hardware.json
    fields:
    - label: 📦 Nhóm thiết bị
      name: danhMuc
      widget: list
      allow_add: true
      summary: '{{fields.nhom}} ({{fields.items}} sản phẩm)'
      fields:
      - label: 🏷️ Tên nhóm
        name: nhom
        widget: string
      - label: 📱 Sản phẩm trong nhóm
        name: items
        widget: list
        allow_add: true
        summary: '{{fields.name}} — {{fields.price}}đ'
        fields:
        - label: 🏷️ Tên sản phẩm (phải khớp CHÍNH XÁC với tên dùng ở nơi khác nếu sản phẩm này được tặng kèm gói)
          name: name
          widget: string
        - label: 💵 Giá
          name: price
          widget: number
          value_type: int
        - label: 🛡️ Bảo hành
          name: warranty
          widget: string
        - label: 🖼️ Ảnh sản phẩm
          name: image
          widget: image
          required: false
