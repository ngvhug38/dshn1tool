<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS · Quản trị bảng giá KiotViet</title>
  <!-- Trang này CHỈ dùng để đăng nhập & soạn thảo nội dung (Decap CMS).
       Trang báo giá cho khách nằm ở /index.html — không đặt chung với trang này. -->

  <!-- Netlify Identity: bắt buộc để backend "git-gateway" xác thực người chỉnh sửa (Netlify Identity user).
       Nếu site không dùng Netlify Identity/Git Gateway mà dùng GitHub backend trực tiếp, có thể bỏ dòng này
       và đổi "backend.name" trong config.yml sang "github" + khai báo repo/branch tương ứng. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script>
    // Trì hoãn CMS tự khởi động (mặc định Decap tự init ngay khi tải xong decap-cms.js) để mình
    // kịp đăng ký widget "currency" tuỳ chỉnh TRƯỚC khi form được vẽ ra. Nếu không có dòng này,
    // field dùng widget "currency" trong config.yml có thể không được nhận diện ở lần tải đầu.
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <!-- Decap CMS (bản kế thừa chính thức của Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ===== Widget tuỳ chỉnh "currency" =====
    // Mục đích: hiển thị số tiền có dấu CHẤM phân cách hàng nghìn khi gõ (VD: gõ "700000"
    // tự hiện thành "700.000"), giúp nhìn/kiểm tra số dễ hơn, tránh gõ nhầm thiếu/thừa số 0.
    // Dữ liệu LƯU XUỐNG vẫn là số nguyên thuần (700000) — giống hệt widget "number" cũ,
    // nên KHÔNG cần sửa gì ở code trang báo giá hay cấu trúc file JSON.
    var CurrencyControl = createClass({
      handleChange: function (e) {
        var digits = e.target.value.replace(/[^0-9]/g, '');
        this.props.onChange(digits ? parseInt(digits, 10) : '');
      },
      render: function () {
        var raw = this.props.value;
        var display = (raw || raw === 0) ? Number(raw).toLocaleString('vi-VN') : '';
        return h('input', {
          type: 'text',
          inputMode: 'numeric',
          value: display,
          onChange: this.handleChange,
          style: {
            width: '100%',
            padding: '10px 13px',
            fontSize: '15px',
            border: '2px solid #dedede',
            borderRadius: '3px',
            boxSizing: 'border-box',
          },
        });
      },
    });
    var CurrencyPreview = createClass({
      render: function () {
        var raw = this.props.value;
        return h('div', {}, (raw || raw === 0) ? Number(raw).toLocaleString('vi-VN') + 'đ' : '(chưa nhập)');
      },
    });
    CMS.registerWidget('currency', CurrencyControl, CurrencyPreview);
  </script>

  <!-- Preview tuỳ chỉnh cho 3 loại nội dung: pricing / hardware / promotions.
       BẮT BUỘC nạp SAU decap-cms.js (đúng như comment ghi sẵn trong chính file preview.js). -->
  <script src="preview.js"></script>

  <script>
    // Điều hướng luồng mời/đặt lại mật khẩu của Netlify Identity về đúng trang xử lý,
    // rồi mở khung đăng nhập — nếu không có đoạn này, link mời qua email sẽ vào thẳng
    // trang này mà không tự mở form nhập mật khẩu.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
    // Khởi động CMS SAU KHI đã đăng ký xong widget "currency" ở trên (vì window.CMS_MANUAL_INIT = true).
    CMS.init();
  </script>
</body>
</html>
