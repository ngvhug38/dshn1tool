<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CMS · Báo giá KiotViet</title>
<!--
  CMS tự xây cho tool báo giá KiotViet — một file duy nhất, không cần cài đặt hay build.
  • Đọc/sửa trực tiếp các file trong thư mục data/ (pricing, promotions, packages, features, hardware, nhanvien).
  • Bấm "Publish" => ghi TẤT CẢ file đã sửa lên GitHub trong 1 commit duy nhất (qua GitHub API + token của bạn).
  • Mẫu hợp đồng (.docx) có thể thay thẳng từ trang "Mẫu hợp đồng".
  • Không thay thế /admin (Decap CMS): hai bên cùng sửa chung data/*.json, dùng cái nào cũng được.
  Đặt file này tại <gốc repo>/cms/index.html => mở https://<site>/cms/
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#0E6B63;--accent-tint:#E6F1EF;--bg:#F4F3EF;--card:#FFFFFF;--line:#E4E2DC;--line2:#EFEDE8;--text:#1C1B19;--muted:#5F5C55;--danger:#B42318}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;background:var(--accent);flex:none}
.grp{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:0 10px;margin:14px 0 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#2B2A27;margin-bottom:2px;min-height:40px}
.nav:hover{background:#F4F3EF}
.nav.on{font-weight:600;background:var(--accent-tint);color:var(--accent)}
.count{margin-left:auto;font-size:12px;color:#4B4840;background:#EEECE7;border-radius:999px;padding:1px 8px}
.nav.on .count{background:#fff}
.dd{width:8px;height:8px;border-radius:50%;background:#D97706;flex:none}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--muted)}
h1{margin:4px 0 0;font-size:22px;font-weight:700}
.btn{font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid #CFCBC2;background:#fff;color:var(--text);min-height:40px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:#FAFAF8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.pri[disabled]{background:#A8B8B5;border-color:#A8B8B5;cursor:not-allowed;filter:none}
.btn.out{color:var(--accent);border-color:var(--accent)}
.btn.dng{color:var(--danger);border-color:#E4B4AE}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:focus-visible,.input:focus-visible,.nav:focus-visible,.sw:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icb{width:32px;height:32px;border-radius:6px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icb:hover{background:#EEECE7;color:var(--text)}
.icb.dng:hover{color:var(--danger)}
.icb .ico{width:16px;height:16px}
.menu{display:none}
.banner{margin:20px 28px 0;padding:12px 16px;border-radius:10px;background:#FFFBEB;border:1px solid #FDE68A;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.info{background:#F0F9FF;border-color:#BAE6FD}
.banner a,.link{color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;padding:0}
.content{padding:24px 28px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.card.pad{padding:18px 20px}
.card h2{font-size:15px;margin:0 0 8px;font-weight:700}
.tbar{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:#EEECE7;border-radius:8px;padding:3px;gap:2px}
.seg button{font-size:13px;padding:5px 10px;border-radius:6px;color:#4B4840;font-weight:500;border:none;background:none;cursor:pointer;min-height:30px}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;text-align:left;color:#4B4840;font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFAF8;white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.rw{cursor:pointer}
.tbl tr.rw:hover{background:#FAFAF8}
.tbl tr.sel{background:var(--accent-tint)!important}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;display:inline-block;white-space:nowrap}
.t-ok{background:#DCFCE7;color:#166534}.t-warn{background:#FEF3C7;color:#92400E}.t-mute{background:#EEECE7;color:#4B4840}.t-bad{background:#FEE2E2;color:#991B1B}.t-acc{background:var(--accent-tint);color:var(--accent)}
.muted{color:var(--muted)}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.input{width:100%;font:inherit;padding:9px 12px;border:1px solid #CFCBC2;border-radius:8px;background:#fff;color:var(--text);min-height:40px}
textarea.input{resize:vertical;min-height:64px}
.unit{position:relative}
.unit .input{padding-right:30px;text-align:right}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.lbl{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.sw{width:40px;height:22px;border-radius:999px;position:relative;display:inline-block;flex:none;border:none;cursor:pointer;background:#CFCBC2;padding:0;transition:background .15s}
.sw[aria-checked=true]{background:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]::after{left:21px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px;align-items:start}
.fgrid.one{grid-template-columns:1fr}
.fld.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;min-height:40px}
.fld.row .lbl{margin:0}
.sec{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:14px}
.sec.in{background:#FBFAF8}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .chev{width:16px;height:16px;transition:transform .15s;color:var(--muted);flex:none}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec>summary .sub{font-weight:400;color:var(--muted);font-size:13px}
.sec>summary .acts{margin-left:auto;display:flex;gap:2px}
.sec .body{padding:4px 14px 16px;border-top:1px solid var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-tint);color:#0B524C;border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chip.bad{background:#FEE2E2;color:#991B1B}
.chip .x{border:none;background:none;cursor:pointer;width:22px;height:22px;border-radius:50%;color:inherit;font-size:16px;line-height:1}
.chip .x:hover{background:rgba(0,0,0,.08)}
.srow{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{background:#FEF3C7;color:#92400E;font-size:11px;border-radius:999px;padding:1px 7px;margin-left:6px}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;padding:6px 10px;border-radius:6px;margin-top:4px;word-break:break-word}
.diff.b{background:#FEF2F2;color:#991B1B}.diff.a{background:#F0FDF4;color:#166534}
.panel{position:sticky;top:96px;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 116px);overflow:auto}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.modalbg{position:fixed;inset:0;background:rgba(20,19,17,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:18px 22px;overflow:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1C1B19;color:#fff;padding:12px 18px;border-radius:10px;z-index:60;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.err{background:#991B1B}
.pimg{width:100%;max-height:140px;object-fit:contain;border:1px solid var(--line2);border-radius:8px;background:#FAFAF8}
.kv{display:flex;gap:8px;margin:4px 0}
.kv b{min-width:120px}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}.panel{position:static;max-height:none}.bottom{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:40;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .menu{display:inline-flex}
  .top{padding:14px 16px}.content{padding:16px}.banner{margin:16px 16px 0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Điều hướng"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>

/* ===================================================================

   =================================================================== */
function diffRec(a, b, path, out) {
  var ta = typeOf(a), tb = typeOf(b);
  if (ta !== tb || (ta !== 'object' && ta !== 'array')) { if (a !== b) out.push({ path: path, before: a, after: b }); return; }
  if (ta === 'array') {
    var prim = a.concat(b).every(function (x) { return x === null || typeof x !== 'object'; });
    if (prim) { if (JSON.stringify(a) !== JSON.stringify(b)) out.push({ path: path, before: a, after: b }); return; }
    var n = Math.max(a.length, b.length);
    for (var i = 0; i < n; i++) {
      if (i >= a.length) out.push({ path: path.concat(i), before: undefined, after: b[i] });
      else if (i >= b.length) out.push({ path: path.concat(i), before: a[i], after: undefined });
      else diffRec(a[i], b[i], path.concat(i), out);
    }
  } else {
    var ks = Object.keys(a); Object.keys(b).forEach(function (k) { if (ks.indexOf(k) < 0) ks.push(k); });
    ks.forEach(function (k) {
      if (!(k in a)) out.push({ path: path.concat(k), before: undefined, after: b[k] });
      else if (!(k in b)) out.push({ path: path.concat(k), before: a[k], after: undefined });
      else diffRec(a[k], b[k], path.concat(k), out);
    });
  }
}
function diffOf(id) { var o = []; if (D[id]) diffRec(D[id].base, D[id].cur, [], o); return o; }
function allDiffs() { var r = {}, total = 0; DATA_IDS.forEach(function (id) { if (D[id]) { var d = diffOf(id); if (d.length) { r[id] = d; total += d.length; } } }); return { by: r, total: total }; }

  var t = typeOf(v);
  if (v === undefined || v === null || v === '') return '(trống)';
  if (t === 'boolean') return v ? 'Bật' : 'Tắt';
  if (t === 'number') return fmt(v);
  if (t === 'array') return v.length ? v.join(', ') : '(trống)';
  if (t === 'object') return '(mục mới)';
  return '"' + v + '"';
}
function pathText(id, path) {
  var parts = [], node = D[id].cur, nb = D[id].base;
  path.forEach(function (k) {
    if (typeof k === 'number') {
      var n = nameOf(node && node[k]) || nameOf(nb && nb[k]);
      parts.push(n || ('Mục ' + (k + 1)));
    } else if (['danhSach', 'danhMuc', 'items'].indexOf(k) < 0) parts.push(lab(k));
    node = node == null ? node : node[k]; nb = nb == null ? nb : nb[k];
  });
  return parts.join(' › ');
}

function touch(fid) { saveDraft(fid); refreshChrome(); }

    else if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { walk(v[k], k); });
  }
  ['pricing', 'promotions'].forEach(function (id) { if (D[id]) { var before = stable(D[id].cur); walk(D[id].cur, ''); if (stable(D[id].cur) !== before) saveDraft(id); } });
  return n;
}
function onInput(t) {
  var fid = t.dataset.f, path = JSON.parse(t.dataset.p), kind = t.dataset.t, key = path[path.length - 1], v;
  if (kind === 'money' || kind === 'int') {
    var digits = t.value.replace(/[^0-9]/g, '');

      if (OPTIONAL[key]) { delAt(D[fid].cur, path); touch(fid); return; }
      v = NULLABLE[key] ? null : 0;
    } else v = parseInt(digits, 10);
    setAt(D[fid].cur, path, v);
  } else {
    if (t.dataset.optstr && t.value === '') { delAt(D[fid].cur, path); touch(fid); return; }

}
function listAt(fid, path) { return getAt(D[fid].cur, path); }

  if (ch === 'dev-add') { if (!t.value) return; var fid = t.dataset.f, a = listAt(fid, JSON.parse(t.dataset.p)); a.push(t.value); touch(fid); renderView(); }
  else if (ch === 'hw-move') {
    var s = UI.sel.hardware, to = +t.value; if (!s || to === s.gi) return;
    var it = D.hardware.cur.danhMuc[s.gi].items.splice(s.ii, 1)[0]; D.hardware.cur.danhMuc[to].items.push(it);
    UI.sel.hardware = { gi: to, ii: D.hardware.cur.danhMuc[to].items.length - 1 }; touch('hardware'); renderView();
  } else if (ch === 'contract-up') uploadContract(t);
  else if (t.id === 'hw-grp') { UI.filter.hardware = t.value; renderView(); }
}

/* ===================================================================
   11. Khởi động
   =================================================================== */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (b.tagName === 'A' && b.dataset.act === 'modal-close') closeModal();
  else actClick(b, e);
  if (!b.closest('.side') && window.innerWidth <= 860) $('#side').classList.remove('open');
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.t) onInput(t);
  else if (t.id === 'q-packages') { UI.q.packages = t.value; var pos = t.selectionStart; renderView(); var n = $('#q-packages'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.id === 'q-hardware') { UI.q.hardware = t.value; var pos2 = t.selectionStart; renderView(); var n2 = $('#q-hardware'); n2.focus(); n2.setSelectionRange(pos2, pos2); }
});
document.addEventListener('change', function (e) { var t = e.target; if (t.dataset && (t.dataset.ch || t.dataset.rename != null) || t.id === 'hw-grp') onChange(t); });
document.addEventListener('toggle', function (e) { var d = e.target; if (d.tagName === 'DETAILS' && d.dataset.k) UI.open[d.dataset.k] = d.open; }, true);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('#modal-root').firstChild) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.rw')) { e.preventDefault(); actClick(e.target, e); }
});
window.addEventListener('hashchange', function () { $('#side').classList.remove('open'); renderAll(); window.scrollTo(0, 0); });
window.addEventListener('beforeunload', function (e) { if (window._cmsDirty) { e.preventDefault(); e.returnValue = ''; } });

renderAll();
loadAll();
})();
</script>
</body>
